service_name: gateway-service
env: local
version: dev

log_level: debug
shutdown_timeout: 10s

http:
  port: 8083
  timeout: 5s

http_tls:
  enabled: false
  cert_file: ""
  key_file: ""


catalog_grpc:
  addr: localhost:9091
  timeout: 3s

auth_grpc:
  addr: localhost:44044
  timeout: 3s

auth_tls:
  enabled: false
  ca_file: ""
  server_name: ""

otlp:
  endpoint: localhost:4317

cart_grpc:
  addr: localhost:9092
  timeout: 3s

cart_tls:
  enabled: false

swagger:
  ui_path: web/swagger/index.html
  redoc_path: web/redoc/index.html
  spec_path: openapi/gateway.v1.yaml

template_path: web/status/index.html

redis:
  addr: localhost:6379
  password: ""
  db: 0
  timeout: 3s

rate_limit:
  limit: 100
  window: 1m

retry:
  max_retries: 6
  initial_interval: 2s
  max_interval: 32s