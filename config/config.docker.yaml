service_name: gateway-service
env: docker
version: dev

log_level: info
shutdown_timeout: 10s

http:
  port: 8083
  timeout: 5s

http_tls:
  enabled: true
  cert_file: /app/certs/gateway-server.crt
  key_file: /app/certs/gateway-server.key


catalog_grpc:
  addr: proxy-service:9095
  timeout: 10s

auth_grpc:
  addr: auth-service:44044
  timeout: 10s

auth_tls:
  enabled: true
  ca_file: /app/certs/ca.crt
  server_name: auth-service
  client_cert_file: /app/certs/gateway-client.crt
  client_key_file: /app/certs/gateway-client.key


otlp:
  endpoint: jaeger:4317

cart_grpc:
  addr: cart-service:9092
  timeout: 10s

cart_tls:
  enabled: false

swagger:
  ui_path: /app/web/swagger/index.html
  redoc_path: /app/web/redoc/index.html
  spec_path: /app/openapi/gateway.v1.yaml

template_path: /app/web/status/index.html

redis:
  addr: redis:6379
  password: ""
  db: 0
  timeout: 3s

rate_limit:
  limit: 100
  window: 1m

retry:
  max_retries: 6
  initial_interval: 2s
  max_interval: 32s