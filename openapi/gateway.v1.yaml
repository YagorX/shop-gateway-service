openapi: 3.0.3
info:
  title: Shop Gateway API
  version: 1.0.0
  description: Public HTTP API for the mini-shop gateway.
servers:
  - url: /
    description: Current gateway origin
tags:
  - name: System
  - name: Catalog
  - name: Cart
  - name: Auth
  - name: Admin
paths:
  /health:
    get:
      tags:
        - System
      summary: Liveness probe
      operationId: health
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '405':
          description: Method not allowed
  /ready:
    get:
      tags:
        - System
      summary: Readiness probe
      operationId: ready
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyErrorResponse'
  /metrics:
    get:
      tags:
        - System
      summary: Prometheus metrics endpoint
      operationId: metrics
      responses:
        '200':
          description: Prometheus metrics payload
          content:
            text/plain:
              schema:
                type: string
  /admin/log-level:
    get:
      tags:
        - Admin
      summary: Get current log level
      operationId: getLogLevel
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XAppIdHeader'
      responses:
        '200':
          description: Current log level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogLevelResponse'
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Authenticated user is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Logger is not initialized
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    post:
      tags:
        - Admin
      summary: Change current log level
      operationId: setLogLevel
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XAppIdHeader'
        - in: query
          name: level
          required: true
          schema:
            type: string
            enum:
              - debug
              - info
              - warn
              - error
      responses:
        '200':
          description: Updated log level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogLevelResponse'
        '400':
          description: Invalid log level
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Authenticated user is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Logger is not initialized
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /products:
    get:
      tags:
        - Catalog
      summary: List products
      operationId: listProducts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XAppIdHeader'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProductsResponse'
        '400':
          description: Bad request or invalid X-App-Id header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /products/stream:
    get:
      tags:
        - Catalog
      summary: Stream products
      description: Streams product payloads using Server-Sent Events.
      operationId: streamProducts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XAppIdHeader'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: SSE stream of products followed by an end event.
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event: product
                  data: {"ID":"prod-001","SKU":"SKU-001","Name":"Coffee Mug"}

                  event: end
                  data: {"status":"completed"}
        '400':
          description: Bad request or invalid X-App-Id header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /products/{id}:
    get:
      tags:
        - Catalog
      summary: Get product by id
      operationId: getProductById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XAppIdHeader'
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid product id or invalid X-App-Id header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /cart:
    get:
      tags:
        - Cart
      summary: Get current user's cart
      operationId: getCart
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XAppIdHeader'
      responses:
        '200':
          description: Cart contents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Cart not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /cart/items:
    post:
      tags:
        - Cart
      summary: Add an item to the cart
      operationId: addCartItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XAppIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
      responses:
        '200':
          description: Item added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: Bad request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /cart/items/update:
    patch:
      tags:
        - Cart
      summary: Update quantity of a cart item
      operationId: updateCartItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XAppIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemRequest'
      responses:
        '200':
          description: Item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: Bad request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /cart/items/remove:
    delete:
      tags:
        - Cart
      summary: Remove an item from the cart
      operationId: removeCartItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XAppIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveItemRequest'
      responses:
        '200':
          description: Item removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: Bad request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /cart/clear:
    delete:
      tags:
        - Cart
      summary: Clear the cart
      operationId: clearCart
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XAppIdHeader'
      responses:
        '200':
          description: Cart cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /status:
    get:
      tags:
        - System
      summary: Render service status page
      operationId: statusPage
      responses:
        '200':
          description: HTML status page
          content:
            text/html:
              schema:
                type: string
        '405':
          description: Method not allowed
        '500':
          description: Failed to render status page
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login and obtain tokens
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /auth/validate:
    post:
      tags:
        - Auth
      summary: Validate access token
      operationId: validateToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access and refresh tokens
      operationId: refreshTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout and revoke refresh token
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logout succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/is-admin:
    post:
      tags:
        - Auth
      summary: Check whether a user is admin
      operationId: isAdmin
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XAppIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IsAdminRequest'
      responses:
        '200':
          description: Admin flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsAdminResponse'
        '400':
          description: Invalid request or invalid X-App-Id header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    XAppIdHeader:
      in: header
      name: X-App-Id
      required: true
      description: Application identifier used by gateway middleware during token validation.
      schema:
        type: integer
        format: int64
        minimum: 1
  headers:
    RetryAfter:
      description: Seconds to wait before retrying the request.
      schema:
        type: integer
        minimum: 1
        example: 1
  responses:
    TooManyRequests:
      description: |
        Request rejected to protect the service; retry after the number of seconds in `Retry-After`.
        `error.code` tells the cause: `too_many_requests` — auth is at its password hashing capacity,
        `rate_limit_exceeded` — the client IP exceeded the gateway rate limit.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: too_many_requests
              message: server is busy, please try again later
    ServiceUnavailable:
      description: Upstream service is unavailable; the request may be retried later.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: service_unavailable
              message: service unavailable
    GatewayTimeout:
      description: Upstream service did not respond in time; the request may be retried later.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: upstream_timeout
              message: upstream timeout
  schemas:
    StatusResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    ReadyErrorResponse:
      type: object
      required:
        - status
        - error
      properties:
        status:
          type: string
          example: not_ready
        error:
          type: string
    LogLevelResponse:
      type: object
      required:
        - level
      properties:
        level:
          type: string
          example: info
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: unauthorized
        message:
          type: string
          example: token validation failed
    Product:
      type: object
      required:
        - ID
        - SKU
        - Name
        - Description
        - PriceCents
        - Currency
        - Stock
        - Active
      properties:
        ID:
          type: string
          example: prod-001
        SKU:
          type: string
          example: SKU-001
        Name:
          type: string
          example: Coffee Mug
        Description:
          type: string
          example: Ceramic mug
        PriceCents:
          type: integer
          format: int64
          minimum: 0
          example: 1999
        Currency:
          type: string
          example: USD
        Stock:
          type: integer
          format: int32
          minimum: 0
          example: 10
        Active:
          type: boolean
          example: true
    ListProductsResponse:
      type: object
      required:
        - items
        - count
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        count:
          type: integer
          example: 2
    OkResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          example: true
    AddItemRequest:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: string
          example: prod-001
        quantity:
          type: integer
          format: int32
          minimum: 1
          example: 2
    UpdateItemRequest:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: string
          example: prod-001
        quantity:
          type: integer
          format: int32
          minimum: 1
          example: 3
    RemoveItemRequest:
      type: object
      required:
        - product_id
      properties:
        product_id:
          type: string
          example: prod-001
    CartItem:
      type: object
      required:
        - product_id
        - quantity
        - price_snapshot_kopecks
        - added_at
      properties:
        product_id:
          type: string
          example: prod-001
        quantity:
          type: integer
          format: int32
          example: 2
        price_snapshot_kopecks:
          type: integer
          format: int64
          example: 199900
        added_at:
          type: string
          format: date-time
    Cart:
      type: object
      required:
        - user_id
        - items
        - created_at
        - updated_at
      properties:
        user_id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          example: demo
        email:
          type: string
          format: email
          example: demo@example.com
        password:
          type: string
          format: password
          example: Test123!
    RegisterResponse:
      type: object
      required:
        - user_uuid
      properties:
        user_uuid:
          type: string
          format: uuid
    LoginRequest:
      type: object
      required:
        - email_or_name
        - password
        - app_id
        - device_id
      properties:
        email_or_name:
          type: string
          example: demo
        password:
          type: string
          format: password
          example: Test123!
        app_id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        device_id:
          type: string
          example: web-1
    LoginResponse:
      type: object
      required:
        - access_token
        - refresh_token
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
    ValidateRequest:
      type: object
      required:
        - token
        - app_id
      properties:
        token:
          type: string
        app_id:
          type: integer
          format: int64
          minimum: 1
          example: 1
    ValidateResponse:
      type: object
      required:
        - user_uuid
      properties:
        user_uuid:
          type: string
          format: uuid
    RefreshRequest:
      type: object
      required:
        - refresh_token
        - app_id
        - device_id
      properties:
        refresh_token:
          type: string
        app_id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        device_id:
          type: string
          example: web-1
    LogoutRequest:
      type: object
      required:
        - refresh_token
        - app_id
        - device_id
      properties:
        refresh_token:
          type: string
        app_id:
          type: integer
          format: int64
          minimum: 1
          example: 1
        device_id:
          type: string
          example: web-1
    LogoutResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          example: true
    IsAdminRequest:
      type: object
      required:
        - user_uuid
      properties:
        user_uuid:
          type: string
          format: uuid
    IsAdminResponse:
      type: object
      required:
        - is_admin
      properties:
        is_admin:
          type: boolean
          example: false
